<!-- <app-navbar-admin></app-navbar-admin> -->
<div *ngIf="currentUser.role === 'Teacher'">
<app-navbar-teacher></app-navbar-teacher>
</div>
<div *ngIf="currentUser.role === 'Admin'">
<app-navbar-admin></app-navbar-admin>
</div>




<div class="container" style="display: flex;justify-content: center; flex-direction: column;">
    <div>
        <input id="search" [(ngModel)]="searchText" placeholder="Search" class="form-control" style="width:300px;margin: 10px; justify-self: right;margin-right: 120px;">
    </div>

    <!-- <p>allstudent works!</p> -->
    <table class="table table-light table-hover " style="width: 1000px;margin-top: 20px;">
        <thead>
            <tr>
                <th>Name</th>
                <th>Role</th>
                <th>Email</th>
                <th>Department</th>
                <th>Profile</th>
                <th>Attendance</th>
            </tr>
        </thead>
        <tbody>
            <tr *ngFor="let student of student | searchFilter :searchText : 'name' ">
                <td>{{ student.name }}</td>
                <td>{{ student.role }}</td>
                <td>{{ student.email }}</td>
                <td>{{ student.dept }}</td>
                <td>
                    <button class="btn btn-outline-primary" (click)="showStudentProfile(student)">
                        <i class="fa-solid fa-user"></i>
                    </button>
                </td> 
                <td>
                    <button class="btn btn-outline-success" (click)="showAttendance(student)">
                        <i class="fa-regular fa-calendar-check"></i>
                    </button>
                </td>
                
            </tr>
        </tbody>
    </table>
    </div>
