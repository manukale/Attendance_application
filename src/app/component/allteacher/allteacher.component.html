<app-navbar-admin></app-navbar-admin>
<div class="container" style="display: flex;justify-content: center; flex-direction: column;">
    <div>
        <input id="search" [(ngModel)]="searchText" placeholder="Search" class="form-control search-style" >
    </div>
    <!-- <p>allstudent works!</p> -->
    <table class="table table-light table-hover " style="width: 1000px;margin-top: 20px;">
        <thead>
            <tr>
                <th>Name</th>
                <th>Role</th>
                <th>Email</th>
                <th>Department</th>
                <!-- <th></th> -->
                <!-- <th></th> -->
            </tr>
        </thead>
        <tbody>
            <tr *ngFor="let teacher of teacher | searchFilter : searchText: 'name' ">
                <td>{{ teacher.name }}</td>
                <td>{{ teacher.role }}</td>
                <td>{{ teacher.email }}</td>
                <td>{{ teacher.dept }}</td>
            </tr>
        </tbody>
    </table>
    </div>
